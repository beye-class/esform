<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崇德專業治療意願調查系統 v3</title>
    <!-- 載入程式庫 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-[#F8FAFC]">
    <div id="root"></div>

    <!-- Firebase 模組載入 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // 全域變數掛載，讓 Babel 腳本可以存取
        window.FirebaseSDK = { initializeApp, getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { 
            initializeApp, getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, 
            getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged 
        } = window.FirebaseSDK;

        // --- 配置 ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'chongde-smart-survey-v3';
        const apiKey = ""; // 執行環境會自動注入
        const ADMIN_PASSWORD = "ntpccdps";

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 自定義圖標組件 (封裝 Lucide)
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons({
                        attrs: { class: className, width: size, height: size },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, className]);
            return <i data-lucide={name} ref={iconRef} className={className}></i>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('survey'); 
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState('');

            const [registry, setRegistry] = useState([]); 
            const [responses, setResponses] = useState([]);
            const [selectedKey, setSelectedKey] = useState('');
            const [localAnswers, setLocalAnswers] = useState({});
            const [status, setStatus] = useState({ type: '', message: '' });
            const [loading, setLoading] = useState(false);
            
            const [rawText, setRawText] = useState('');
            const [imgBase64, setImgBase64] = useState(null);
            const [isParsing, setIsParsing] = useState(false);
            const fileInputRef = useRef(null);

            // --- 認證 ---
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth Error:", err); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- 監聽資料 ---
            useEffect(() => {
                if (!user) return;
                const respCol = collection(db, 'artifacts', appId, 'public', 'data', 'survey_results');
                const unsubResp = onSnapshot(respCol, (snap) => {
                    setResponses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                const registryRef = doc(db, 'artifacts', appId, 'public', 'data', 'registry', 'active');
                const unsubRegistry = onSnapshot(registryRef, (snap) => {
                    if (snap.exists()) setRegistry(snap.data().list || []);
                });
                return () => { unsubResp(); unsubRegistry(); };
            }, [user]);

            // --- 邏輯 ---
            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) {
                    setIsAdminAuthenticated(true);
                    setView('admin');
                    setLoginError('');
                } else {
                    setLoginError('密碼錯誤');
                }
            };

            const copyToClipboard = (text, msg) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setStatus({ type: 'success', message: msg });
            };

            const exportToCSV = () => {
                if (responses.length === 0) return setStatus({ type: 'error', message: '尚無資料' });
                const headers = ['班級', '學生姓名', '時段', '治療項目', '地點', '意願', '備註'];
                const csvRows = responses.map(r => [
                    r.studentClass, r.studentName, `"${r.assignedSlot}"`, r.therapyType, r.loc, 
                    r.parentWillAttend ? '參加' : '不參加', `"${r.note || ''}"`
                ]);
                const content = "\uFEFF" + [headers, ...csvRows].map(e => e.join(",")).join("\n");
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `崇德調查_${new Date().toLocaleDateString()}.csv`;
                link.click();
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const base64 = ev.target.result.split(',')[1];
                    setImgBase64(base64);
                    parseWithAI(base64, file.type);
                };
                reader.readAsDataURL(file);
            };

            const parseWithAI = async (imgData = null, mime = "image/png") => {
                const targetImg = imgData || imgBase64;
                if (!targetImg && !rawText.trim()) return;
                setIsParsing(true);
                setStatus({ type: '', message: '' });

                const systemPrompt = `你是一個專業課表解析助手。輸出格式為純 JSON 陣列。
                [{ "id": "uuid", "name": "姓名", "class": "班級", "slot": "日期時段", "type": "治療項目", "loc": "地點" }]`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: targetImg ? "解析此圖片表格" : `解析此文字：\n${rawText}` },
                                    ...(targetImg ? [{ inlineData: { mimeType: mime, data: targetImg } }] : [])
                                ]
                            }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const result = await response.json();
                    const data = JSON.parse(result.candidates[0].content.parts[0].text);
                    if (Array.isArray(data)) {
                        setRegistry(data);
                        setStatus({ type: 'success', message: `解析完成，共 ${data.length} 筆` });
                    }
                } catch (err) {
                    setStatus({ type: 'error', message: '解析失敗' });
                } finally { setIsParsing(false); }
            };

            const saveRegistry = async () => {
                setLoading(true);
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registry', 'active'), {
                        list: registry, updatedAt: new Date().toISOString()
                    });
                    setStatus({ type: 'success', message: '名單已發布' });
                } catch (e) { setStatus({ type: 'error', message: '儲存失敗' }); }
                finally { setLoading(true); }
            };

            const submitSurvey = async () => {
                const incomplete = studentSessions.some(s => !localAnswers[s.id] || localAnswers[s.id].attend === undefined);
                if (incomplete) return setStatus({ type: 'error', message: '請完成所有勾選' });
                setLoading(true);
                try {
                    const promises = studentSessions.map(s => {
                        const ans = localAnswers[s.id];
                        return setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'survey_results', s.id), {
                            studentClass: s.class, studentName: s.name, assignedSlot: s.slot,
                            therapyType: s.type, loc: s.loc, parentWillAttend: ans.attend,
                            note: ans.note || '', submittedAt: new Date().toISOString()
                        });
                    });
                    await Promise.all(promises);
                    setStatus({ type: 'success', message: '提交成功！' });
                    setSelectedKey('');
                    setLocalAnswers({});
                    window.scrollTo(0,0);
                } catch (e) { setStatus({ type: 'error', message: '送出失敗' }); }
                finally { setLoading(false); }
            };

            const UNIQUE_STUDENTS = useMemo(() => {
                const seen = new Set();
                return registry.reduce((acc, curr) => {
                    const k = `${curr.class}-${curr.name}`;
                    if (!seen.has(k)) { seen.add(k); acc.push({ class: curr.class, name: curr.name }); }
                    return acc;
                }, []).sort((a,b) => (a.class||'').localeCompare(b.class||''));
            }, [registry]);

            const studentSessions = useMemo(() => selectedKey ? registry.filter(s => `${s.class}-${s.name}` === selectedKey) : [], [selectedKey, registry]);

            return (
                <div className="min-h-screen pb-20">
                    <nav className="bg-white border-b sticky top-0 z-50 px-4 h-16 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="bg-indigo-600 p-1.5 rounded-lg text-white">
                                <Icon name="shield-check" size={20} />
                            </div>
                            <span className="font-black text-slate-800">崇德 Smart Survey <span className="text-indigo-600 italic">HTML 版</span></span>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setView('survey')} className={`px-4 py-1.5 rounded-lg text-sm font-bold ${view === 'survey' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}>家長填寫</button>
                            <button onClick={() => isAdminAuthenticated ? setView('admin') : setView('login')} className={`px-4 py-1.5 rounded-lg text-sm font-bold ${view !== 'survey' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}>後台管理</button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto px-4 pt-8">
                        {status.message && (
                            <div className={`mb-6 p-4 rounded-2xl border flex items-center justify-between ${status.type === 'success' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-rose-50 text-rose-700 border-rose-100'}`}>
                                <div className="flex items-center gap-3 font-bold text-sm">
                                    <Icon name={status.type === 'success' ? 'check-circle-2' : 'alert-circle'} size={18} />
                                    {status.message}
                                </div>
                                <button onClick={() => setStatus({type:'', message:''})}><Icon name="x-circle" size={16} className="opacity-40" /></button>
                            </div>
                        )}

                        {view === 'survey' ? (
                            <div className="space-y-6">
                                <header className="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-[2rem] p-10 text-white shadow-xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <h1 className="text-4xl font-black mb-3">治療參與意願調查</h1>
                                        <p className="opacity-90">請選取學生，系統將自動顯示本月的所有排課時段。</p>
                                    </div>
                                    <div className="absolute right-[-20px] bottom-[-20px] opacity-10 rotate-12"><Icon name="sparkles" size={160} /></div>
                                </header>

                                <div className="bg-white p-8 rounded-3xl border shadow-sm">
                                    <h2 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">第一步：選取學生姓名</h2>
                                    <select 
                                        value={selectedKey} 
                                        onChange={e => {setSelectedKey(e.target.value); setLocalAnswers({}); }}
                                        className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-xl outline-none focus:border-indigo-500 appearance-none"
                                    >
                                        <option value="">請點擊此處展開名單</option>
                                        {UNIQUE_STUDENTS.map(s => <option key={`${s.class}-${s.name}`} value={`${s.class}-${s.name}`}>【{s.class}】 {s.name}</option>)}
                                    </select>
                                </div>

                                {studentSessions.length > 0 && (
                                    <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-500">
                                        <div className="text-xs font-black text-slate-400 px-2">第二步：確認所有時段意願</div>
                                        {studentSessions.map((s, idx) => {
                                            const ans = localAnswers[s.id] || {};
                                            return (
                                                <div key={s.id} className="bg-white rounded-[1.5rem] border shadow-sm overflow-hidden">
                                                    <div className="bg-slate-50 px-8 py-4 flex justify-between items-center border-b font-bold">
                                                        <span>{s.type}</span>
                                                        <span className="text-[10px] bg-indigo-600 text-white px-3 py-1 rounded-full">{idx+1}</span>
                                                    </div>
                                                    <div className="p-8 space-y-6">
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                            <div className="bg-slate-50 p-4 rounded-xl flex items-center gap-3">
                                                                <Icon name="calendar-days" size={20} className="text-indigo-500" />
                                                                <div><p className="text-[10px] text-slate-400 font-bold">時間</p><p className="font-bold">{s.slot}</p></div>
                                                            </div>
                                                            <div className="bg-slate-50 p-4 rounded-xl flex items-center gap-3">
                                                                <Icon name="map-pin" size={20} className="text-indigo-500" />
                                                                <div><p className="text-[10px] text-slate-400 font-bold">地點</p><p className="font-bold">{s.loc}</p></div>
                                                            </div>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <button onClick={() => handleAnswer(s.id, 'attend', true)} className={`py-4 rounded-xl border-2 font-bold flex items-center justify-center gap-2 transition-all ${ans.attend === true ? 'bg-indigo-600 border-indigo-600 text-white' : 'text-slate-400 border-slate-100 hover:border-indigo-100'}`}><Icon name="check-circle" size={18}/>會參加</button>
                                                            <button onClick={() => handleAnswer(s.id, 'attend', false)} className={`py-4 rounded-xl border-2 font-bold flex items-center justify-center gap-2 transition-all ${ans.attend === false ? 'bg-slate-800 border-slate-800 text-white' : 'text-slate-400 border-slate-100 hover:border-slate-200'}`}><Icon name="x-circle" size={18}/>不參加</button>
                                                        </div>
                                                        <input type="text" placeholder="備註事項..." value={ans.note || ''} onChange={e => handleAnswer(s.id, 'note', e.target.value)} className="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-xl outline-none focus:border-indigo-500" />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        <button onClick={submitSurvey} className="w-full py-6 bg-indigo-600 text-white rounded-[1.5rem] font-black text-2xl shadow-xl hover:bg-indigo-700 active:scale-95 transition-all">提交意願調查</button>
                                    </div>
                                )}
                            </div>
                        ) : view === 'login' ? (
                            <div className="max-w-md mx-auto mt-20 bg-white rounded-3xl border shadow-2xl overflow-hidden p-10 text-center">
                                <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 text-white shadow-lg shadow-indigo-100 rotate-12"><Icon name="lock" size={32} className="-rotate-12"/></div>
                                <h2 className="text-2xl font-black mb-6">管理者登入</h2>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <input type="password" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} placeholder="後台密碼" className="w-full p-4 bg-slate-50 border-2 rounded-xl text-center font-bold tracking-widest outline-none focus:border-indigo-500" />
                                    <button type="submit" className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg">進入系統</button>
                                </form>
                            </div>
                        ) : (
                            <div className="space-y-8 animate-in fade-in duration-700">
                                <header className="bg-white p-8 rounded-3xl border shadow-sm flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div><h2 className="text-3xl font-black">數據管理後台</h2><button onClick={() => copyToClipboard(window.location.href, '連結已複製')} className="text-indigo-600 font-bold text-xs mt-2 flex items-center gap-1 hover:underline"><Icon name="share-2" size={12}/>分享調查連結</button></div>
                                    <div className="flex gap-2 w-full md:w-auto">
                                        <button onClick={exportToCSV} className="flex-1 bg-slate-800 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2"><Icon name="download" size={18}/>匯出報表</button>
                                        <button onClick={() => setView('survey')} className="bg-slate-100 p-3 rounded-xl text-slate-500"><Icon name="log-out" size={18}/></button>
                                    </div>
                                </header>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-white p-6 rounded-2xl border text-indigo-600"><p className="text-[10px] font-black uppercase opacity-50 mb-1">名單總數</p><p className="text-3xl font-black">{registry.length}</p></div>
                                    <div className="bg-white p-6 rounded-2xl border text-indigo-600"><p className="text-[10px] font-black uppercase opacity-50 mb-1">已填回覆</p><p className="text-3xl font-black">{responses.length}</p></div>
                                    <div className="bg-white p-6 rounded-2xl border text-emerald-600"><p className="text-[10px] font-black uppercase opacity-50 mb-1">家長出席</p><p className="text-3xl font-black">{responses.filter(r => r.parentWillAttend).length}</p></div>
                                    <div className="bg-white p-6 rounded-2xl border text-amber-600"><p className="text-[10px] font-black uppercase opacity-50 mb-1">完成率</p><p className="text-3xl font-black">{registry.length ? Math.round(responses.length/registry.length*100) : 0}%</p></div>
                                </div>

                                <section className="bg-white rounded-3xl border shadow-sm overflow-hidden">
                                    <div className="bg-slate-50 px-8 py-4 border-b font-black flex items-center gap-2"><Icon name="sparkles" size={18} className="text-indigo-600" /> AI 智慧解析課表</div>
                                    <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="space-y-4">
                                            <p className="text-sm font-bold text-slate-500 flex items-center gap-2"><Icon name="file-text" size={16}/> 方式一：貼上文字</p>
                                            <textarea value={rawText} onChange={e => setRawText(e.target.value)} placeholder="貼上 Word 課表內容..." className="w-full h-40 bg-slate-50 border-2 rounded-2xl p-4 text-xs font-mono" />
                                            <button onClick={() => parseWithAI()} className="w-full py-4 bg-slate-800 text-white rounded-xl font-bold">執行解析</button>
                                        </div>
                                        <div className="space-y-4 text-center">
                                            <p className="text-sm font-bold text-slate-500 flex items-center justify-center gap-2"><Icon name="image" size={16}/> 方式二：上傳截圖 (推薦)</p>
                                            <div onClick={() => fileInputRef.current.click()} className="h-40 border-2 border-dashed rounded-2xl flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-slate-50 transition-all text-slate-300 hover:text-indigo-500">
                                                <Icon name="image" size={40} />
                                                <span className="text-xs font-bold">點擊上傳截圖</span>
                                                <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleImageUpload} />
                                            </div>
                                            <p className="text-[10px] text-rose-400 font-bold italic">💡 視覺解析表格更精準</p>
                                        </div>
                                    </div>
                                    {registry.length > 0 && (
                                        <div className="px-8 pb-8"><button onClick={saveRegistry} className="w-full py-4 bg-emerald-600 text-white rounded-xl font-black text-lg shadow-lg">發布名單到雲端</button></div>
                                    )}
                                </section>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
